<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布文章 - 比特的小博客</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="/">比特的小博客</a>
      <div class="nav-links">
        <a href="/">主页</a>
        <a href="/archives.html">归档</a>
        <a href="/files.html">文件</a>
        <a href="#" id="nav-publish" class="hidden">发布</a>
        <a href="#" id="nav-profile" class="hidden">我的主页</a>
        <a href="/login.html" id="nav-login">登录</a>
        <a href="#" id="nav-logout" class="hidden">退出</a>
        <a href="#" id="theme-toggle" title="切换主题">🌙</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="publish-box">
      <h1 class="page-title">发布文章</h1>
      <p id="pub-msg" class="status-msg"></p>
      <form id="publish-form">
        <label>标题</label>
        <input type="text" id="pub-title" maxlength="80" required>
        <label>摘要（可选，留空自动截取）</label>
        <input type="text" id="pub-excerpt" maxlength="120">
        <label>内容</label>
        <textarea id="pub-content" rows="12" required></textarea>
        <label>标签（逗号分隔，可选）</label>
        <input type="text" id="pub-tags" placeholder="C++, 算法, GESP">
        <label>归属区域</label>
        <div id="pub-zone-wrap">
          <select id="pub-zone">
            <option value="public">知识区（所有人可见）</option>
            <option value="private">私密区（仅管理员可发布）</option>
          </select>
        </div>
        <button type="submit" id="pub-submit">发布</button>
      </form>
    </div>
  </main>

  <footer class="site-footer" style="margin-top:auto;">Powered by 多AI协作 🤖</footer>

  <script src="publish.js"></script>
</body>
</html>
