<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件 - 比特的小博客</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="/">比特的小博客</a>
      <div class="nav-links">
        <a href="/">主页</a>
        <a href="/archives.html">归档</a>
        <a href="/files.html" class="active">文件</a>
        <a href="#" id="nav-private" class="hidden">私密区</a>
        <a href="#" id="nav-publish" class="hidden">发布</a>
        <a href="#" id="nav-profile" class="hidden">我的主页</a>
        <a href="/login.html" id="nav-login">登录</a>
        <a href="#" id="nav-logout" class="hidden">退出</a>
        <a href="#" id="theme-toggle" title="切换主题">🌙</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="breadcrumb"><a href="/">首页</a> › <span>文件</span></div>
    <h1 class="page-title">📁 文件资源</h1>
    <p class="status-msg" style="margin-bottom:16px">资源来自 OJ 网盘，登录用户可下载</p>

    <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center">
      <input id="file-search" placeholder="🔍 搜文件名…" style="flex:1;padding:10px 14px;font-size:14px;border:2px solid #e2e5ea;border-radius:10px;outline:none;background:#fff;color:#222">
    </div>
    <ul id="file-list" class="file-list"><li class="status-msg">加载中…</li></ul>
    <div id="file-pager" class="pager"></div>
    <p id="file-status" class="status-msg"></p>
  </main>

  <footer class="site-footer">Powered by 多AI协作 🤖</footer>

  <script src="files.js"></script>
</body>
</html>
